<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LittleMesh</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <section id="viewport">
        <div id="canvas-host"></div>

        <div id="toolbar" hidden>
          <button id="btn-frame" title="Frame the model (F)">Frame</button>
          <button id="btn-wire" title="Show wireframe (W)" aria-pressed="false">Wireframe</button>
          <button id="btn-checker" title="Show a checker texture to judge UV stretch (C)" aria-pressed="false">Checker</button>
        </div>

        <div id="view-label" hidden></div>

        <div id="empty">
          <div class="empty-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
              <path d="m3.3 7 8.7 5 8.7-5" />
              <path d="M12 22V12" />
            </svg>
          </div>
          <h1>Drop a mesh here</h1>
          <p>glTF, GLB, OBJ or FBX</p>
          <button id="btn-open-empty" class="primary" title="Open a file (Ctrl+O)">Open file…</button>
        </div>

        <div id="drop-hint" hidden><span>Drop to open</span></div>
      </section>

      <aside id="panel">
        <header>
          <span class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
                <path d="m3.3 7 8.7 5 8.7-5" />
                <path d="M12 22V12" />
              </svg>
            </span>
            LittleMesh
          </span>
          <button id="btn-theme" class="icon-button" title="Theme" aria-haspopup="dialog" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" />
            </svg>
          </button>
          <button id="btn-open" title="Open a file (Ctrl+O)">Open…</button>
        </header>

        <div id="theme-popover" role="dialog" aria-label="Theme" hidden>
          <span class="popover-label">Mode</span>
          <div class="segmented" role="group" aria-label="Mode">
            <button data-mode="light">Light</button>
            <button data-mode="dark">Dark</button>
            <button data-mode="system">System</button>
          </div>
          <span class="popover-label">Colour</span>
          <div class="swatches" role="group" aria-label="Colour">
            <button data-color="neutral"><span class="dot" data-color="neutral"></span>Neutral</button>
            <button data-color="blue"><span class="dot" data-color="blue"></span>Blue</button>
            <button data-color="green"><span class="dot" data-color="green"></span>Green</button>
            <button data-color="orange"><span class="dot" data-color="orange"></span>Orange</button>
            <button data-color="rose"><span class="dot" data-color="rose"></span>Rose</button>
            <button data-color="violet"><span class="dot" data-color="violet"></span>Violet</button>
          </div>
        </div>

        <div id="file" class="card" hidden>
          <h2 id="file-name"></h2>
          <p id="file-summary" class="muted"></p>
          <dl id="file-stats"></dl>
        </div>

        <ul id="warnings" hidden></ul>

        <div id="process" class="card" hidden>
          <button id="btn-process" class="primary wide" title="Clean up, optimize and make LODs (Ctrl+Enter)">Process</button>
          <p id="process-status" class="muted" hidden></p>

          <details id="options">
            <summary>Options</summary>
            <label class="check" title="Unwrap new UVs for texturing. On by default only when the file has none.">
              <input type="checkbox" id="opt-uvs" /> Generate UVs
            </label>
            <label class="row" title="The texture size the UVs are packed for. Bigger sizes keep islands closer together.">
              Texture size
              <select id="opt-res">
                <option value="512">512 px</option>
                <option value="1024">1024 px</option>
                <option value="2048">2048 px</option>
                <option value="4096">4096 px</option>
              </select>
            </label>
            <label class="check" title="Make lighter versions of the mesh (50%, 25% and 12.5% of the triangles) for distant views.">
              <input type="checkbox" id="opt-lods" /> Make LODs
            </label>
            <button id="btn-reset" class="link" title="Back to the defaults for this file">Reset options</button>
          </details>
        </div>

        <div id="results" class="card" hidden>
          <div class="segmented" role="group" aria-label="Which mesh to show">
            <button id="btn-view-input" title="The file as loaded">Original</button>
            <button id="btn-view-output" title="The processed result">Result</button>
          </div>
          <div id="lod-picker" class="segmented" role="group" aria-label="LOD level" title="Previous and next LOD: [ and ]"></div>
          <table id="lod-table"></table>
          <div id="uv-summary"></div>
          <button id="btn-export" class="primary wide" title="Save the result as glTF (Ctrl+E)">Export…</button>
          <p id="export-status" class="muted" hidden></p>
        </div>

        <p id="error" role="alert" hidden></p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
