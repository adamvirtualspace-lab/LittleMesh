[workspace]
members = ["crates/lm-core", "crates/lm-cli", "crates/lm-xatlas", "crates/lm-ufbx", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/adamvirtualspace-lab/LittleMesh"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
